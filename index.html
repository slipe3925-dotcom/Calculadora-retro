        /* Custom retro styles & animations */
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;

        /* CRT Scanline Effect */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%

            background-size: 100% 4px;

    <script>
        // --- Web Audio API (Synthesizer Sounds) ---
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick(freq = 600, type = 'square', duration = 0.03) {
                if (this.muted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + duration);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    console.error("Audio error", e);
                }
            }

            playBeep(freq = 800) {
                this.playClick(freq, 'sine', 0.08);
            }

            playError() {
                if (this.muted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime + 0.1);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                } catch (e) {}
            }
        }

        const audio = new RetroAudio();

        // --- Calculator Core Logic ---
        class Calculator {
            constructor(displayElem, expressionElem, historyListElem) {
                this.displayElem = displayElem;
                this.expressionElem = expressionElem;
                this.historyListElem = historyListElem;
                
                this.currentValue = '0';
                this.expression = '';
                this.shouldResetDisplay = false;
                this.history = [];

                this.updateDisplay();
            }

            appendNumber(number) {
                if (this.currentValue === '0' || this.shouldResetDisplay) {
                    this.currentValue = number;
                    this.shouldResetDisplay = false;
                } else {
                    if (this.currentValue.length >= 10) return; // Limit display length
                    this.currentValue += number;
                }
                this.updateDisplay();
            }

            appendDecimal() {
                if (this.shouldResetDisplay) {
                    this.currentValue = '0.';
                    this.shouldResetDisplay = false;
                    this.updateDisplay();
                    return;
                }
                if (!this.currentValue.includes('.')) {
                    this.currentValue += '.';
                    this.updateDisplay();
                }
            }

            setOperator(op) {
                if (this.expression && !this.shouldResetDisplay) {
                    this.calculate(false);
                }
                this.expression = `${this.currentValue} ${op}`;
                this.shouldResetDisplay = true;
                this.updateDisplay();
            }

            calculate(isFinal = true) {
                if (!this.expression) return;

                const fullExpression = `${this.expression} ${this.currentValue}`;
                // Replace visual operators with JavaScript JS math operators
                const sanitizedExpr = fullExpression
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');

                try {
                    let result = eval(sanitizedExpr);
                    
                    if (!isFinite(result)) {
                        audio.playError();
                        this.currentValue = 'ERRO';
                        this.expression = '';
                        this.shouldResetDisplay = true;
                        this.updateDisplay();
                        return;
                    }

                    // Format float numbers cleanly
                    result = Math.round(result * 100000000) / 100000000;
                    
                    if (isFinal) {
                        this.addHistory(fullExpression, result);
                        this.expression = '';
                    } else {
                        this.expression = `${result}`;
                    }

                    this.currentValue = String(result);
                    this.shouldResetDisplay = true;
                    this.updateDisplay();
                } catch (e) {
                    audio.playError();
                    this.currentValue = 'ERRO';
                    this.expression = '';
                    this.shouldResetDisplay = true;
                    this.updateDisplay();
                }
            }

            clear() {
                this.currentValue = '0';
                this.expression = '';
                this.shouldResetDisplay = false;
                this.updateDisplay();
            }

            delete() {
                if (this.shouldResetDisplay) return;
                if (this.currentValue.length === 1 || this.currentValue === 'ERRO') {
                    this.currentValue = '0';
                } else {
                    this.currentValue = this.currentValue.slice(0, -1);
                }
                this.updateDisplay();
            }

            toggleSign() {
                if (this.currentValue === '0' || this.currentValue === 'ERRO') return;
                this.currentValue = String(parseFloat(this.currentValue) * -1);
                this.updateDisplay();
            }

            percentage() {
                if (this.currentValue === 'ERRO') return;
                this.currentValue = String(parseFloat(this.currentValue) / 100);
                this.shouldResetDisplay = true;
                this.updateDisplay();
            }

            squareRoot() {
                if (this.currentValue === 'ERRO') return;
                const val = parseFloat(this.currentValue);
                if (val < 0) {
                    audio.playError();
                    this.currentValue = 'ERRO';
                } else {
                    this.currentValue = String(Math.round(Math.sqrt(val) * 100000000) / 100000000);
                }
                this.shouldResetDisplay = true;
                this.updateDisplay();
            }

            addHistory(expr, res) {
                this.history.unshift({ expr, res });
                if (this.history.length > 15) this.history.pop();
                this.renderHistory();
            }

            renderHistory() {
                if (this.history.length === 0) {
                    this.historyListElem.innerHTML = '<li class="text-xs text-center opacity-60">Nenhum cálculo recente</li>';
                    return;
                }
                this.historyListElem.innerHTML = this.history.map((item, idx) => `
                    <li class="cursor-pointer hover:bg-synth-lcdDark/10 p-1 rounded transition-colors" data-history-idx="${idx}">
                        <div class="text-[10px] opacity-70">${item.expr} =</div>
                        <div class="text-base font-bold">${item.res}</div>
                    </li>
                `).join('');
            }

            updateDisplay() {
                this.displayElem.textContent = this.currentValue;
                this.expressionElem.textContent = this.expression;
            }
        }

        // --- DOM Elements & Event Handlers ---
        document.addEventListener('DOMContentLoaded', () => {
            const displayEl = document.getElementById('display');
            const expressionEl = document.getElementById('expression');
            const historyListEl = document.getElementById('history-list');
            const historyPanel = document.getElementById('history-panel');
            const historyToggleBtn = document.getElementById('history-toggle');
            const closeHistoryBtn = document.getElementById('close-history');
            const soundBtn = document.getElementById('sound-btn');
            const soundIcon = document.getElementById('sound-icon');
            const btnCopy = document.getElementById('btn-copy');
            const btnSqrt = document.getElementById('btn-sqrt');
            const toast = document.getElementById('toast');

            const calc = new Calculator(displayEl, expressionEl, historyListEl);

            // Button Click Handler
            document.querySelectorAll('button[data-val], button[data-action]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const val = btn.getAttribute('data-val');
                    const action = btn.getAttribute('data-action');

                    // Visual Active State for Touch/Mouse
                    btn.classList.add('active');
                    setTimeout(() => btn.classList.remove('active'), 100);

                    // Audio feedback
                    if (action === 'calculate') audio.playBeep(900);
                    else if (action === 'clear') audio.playBeep(400);
                    else audio.playClick();

                    if (val !== null) {
                        if (['+', '-', '*', '/'].includes(val)) {
                            calc.setOperator(val);
                        } else {
                            calc.appendNumber(val);
                        }
                    } else if (action) {
                        switch (action) {
                            case 'clear': calc.clear(); break;
                            case 'delete': calc.delete(); break;
                            case 'operator': calc.setOperator(btn.getAttribute('data-val')); break;
                            case 'calculate': calc.calculate(); break;
                            case 'negate': calc.toggleSign(); break;
                            case 'percent': calc.percentage(); break;
                        }
                    }
                });
            });

            // Special Options (Copy & Square Root)
            btnSqrt.addEventListener('click', () => {
                audio.playBeep(700);
                calc.squareRoot();
            });

            btnCopy.addEventListener('click', () => {
                audio.playBeep(800);
                const textToCopy = calc.currentValue;
                
                // Fallback copy for iframe environment
                const dummy = document.createElement("textarea");
                document.body.appendChild(dummy);
                dummy.value = textToCopy;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);

                // Show Toast Notification
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 2000);
            });

            // Toggle History Panel
            historyToggleBtn.addEventListener('click', () => {
                audio.playClick(500);
                historyPanel.classList.remove('hidden');
            });

            closeHistoryBtn.addEventListener('click', () => {
                audio.playClick(400);
                historyPanel.classList.add('hidden');
            });

            // Load value from history
            historyListEl.addEventListener('click', (e) => {
                const li = e.target.closest('[data-history-idx]');
                if (li) {
                    const idx = li.getAttribute('data-history-idx');
                    const item = calc.history[idx];
                    if (item) {
                        calc.currentValue = String(item.res);
                        calc.shouldResetDisplay = true;
                        calc.updateDisplay();
                        audio.playBeep(750);
                        historyPanel.classList.add('hidden');
                    }
                }
            });

            // Mute / Unmute Audio
            soundBtn.addEventListener('click', () => {
                audio.muted = !audio.muted;
                soundIcon.textContent = audio.muted ? '🔇' : '🔊';
            });

            // --- Touch Swipe Gestures (Swipe Left/Right on Display to Delete) ---
            let touchStartX = 0;
            let touchEndX = 0;

            const displayContainer = displayEl.parentElement;

            displayContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            displayContainer.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const swipeDistance = touchEndX - touchStartX;
                if (Math.abs(swipeDistance) > 40) { // Swipe threshold
                    audio.playClick(350);
                    calc.delete();
                }
            }

            // --- Keyboard Support ---
            document.addEventListener('keydown', (e) => {
                if (e.key >= '0' && e.key <= '9') {
                    calc.appendNumber(e.key);
                    audio.playClick();
                    triggerVisualButton(`button[data-val="${e.key}"]`);
                } else if (e.key === '.') {
                    calc.appendDecimal();
                    audio.playClick();
                    triggerVisualButton('button[data-val="."]');
                } else if (['+', '-', '*', '/'].includes(e.key)) {
                    calc.setOperator(e.key);
                    audio.playClick();
                    triggerVisualButton(`button[data-val="${e.key}"]`);
                } else if (e.key === 'Enter' || e.key === '=') {
                    e.preventDefault();
                    calc.calculate();
                    audio.playBeep(900);
                    triggerVisualButton('button[data-action="calculate"]');
                } else if (e.key === 'Backspace') {
                    calc.delete();
                    audio.playClick();
                    triggerVisualButton('button[data-action="delete"]');
                } else if (e.key === 'Escape') {
                    calc.clear();
                    audio.playBeep(400);
                    triggerVisualButton('button[data-action="clear"]');
                } else if (e.key.toLowerCase() === 'h') {
                    historyPanel.classList.toggle('hidden');
                    audio.playClick();
                }
            });

            function triggerVisualButton(selector) {
                const btn = document.querySelector(selector);
                if (btn) {
                    btn.classList.add('active');
                    setTimeout(() => btn.classList.remove('active'), 100);
                }
            }
        });
